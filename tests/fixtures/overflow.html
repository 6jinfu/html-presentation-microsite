<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  .slide, .slide-canvas { width: 1920px; height: 1080px; }
  .clip { width: 120px; height: 28px; overflow: hidden; font-size: 20px; }
  .frame { min-width: 0; overflow: hidden; }
  @page { size: 13.333in 7.5in; margin: 0; }
</style>
</head>
<body>
<section class="slide is-active" data-layout="metrics" data-id="overflow">
  <div class="slide-canvas">
    <div class="frame">
      <p class="clip" data-fit>这是一段故意写长的中文，用来撑破固定高度的文本盒子。</p>
    </div>
  </div>
</section>
</body>
</html>
